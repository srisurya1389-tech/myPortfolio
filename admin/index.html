<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Portfolio Admin</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2318161c'/%3E%3Cpath d='M18 44l8-24h4l8 24M21 36h14M44 20v24' stroke='%23e8233a' stroke-width='5' fill='none'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Bebas+Neue&display=swap">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div class="app" id="app">
  <aside class="side" id="side">
    <div class="logo"><b>ADMIN</b><span>Portfolio studio</span></div>
    <nav class="pages" id="pages"></nav>
    <div class="side-foot">
      <a href="../" target="_blank" rel="noopener">Open live site ↗</a>
    </div>
  </aside>

  <section class="main">
    <header class="bar">
      <button class="btn ghost only-m" id="menuBtn" type="button" aria-label="Menu">☰</button>
      <div class="status" id="status"><i></i><span>Loading…</span></div>
      <div class="bar-r">
        <button class="btn ghost" id="previewBtn" type="button">Preview</button>
        <button class="btn primary" id="publishBtn" type="button">Publish</button>
      </div>
    </header>
    <div class="scroll" id="scroll">
      <div class="form" id="form"></div>
    </div>
  </section>

  <section class="pv" id="pv">
    <div class="pv-bar">
      <div class="seg" role="group" aria-label="Preview size">
        <button type="button" class="on" data-w="desktop">Desktop</button>
        <button type="button" data-w="phone">Phone</button>
      </div>
      <span class="pv-note">Live draft</span>
      <div class="pv-r">
        <button class="btn ghost sm" id="pvReload" type="button">Reload</button>
        <button class="btn ghost sm" id="pvOpen" type="button">New tab ↗</button>
        <button class="btn ghost sm" id="pvClose" type="button" aria-label="Close preview">✕</button>
      </div>
    </div>
    <div class="pv-stage" id="pvStage"><iframe id="frame" title="Site preview"></iframe></div>
  </section>
</div>

<div class="modal" id="modal" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <h3 id="mTitle"></h3>
    <div id="mBody"></div>
    <div class="m-actions" id="mActions"></div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script src="admin.js"></script>
</body>
</html>
